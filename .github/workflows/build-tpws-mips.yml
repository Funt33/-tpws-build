name: Build tpws for MIPS big-endian
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tpws-mips.yml"
permissions:
  contents: read
jobs:
  build-tpws-mips:
    runs-on: ubuntu-latest
    steps:
      - name: Install MIPS big-endian cross compiler from apt
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mips-linux-gnu binutils-mips-linux-gnu file

      - name: Clone zapret
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bol-van/zapret.git zapret

      - name: Build tpws statically (direct gcc, no make, no zlib)
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          mips-linux-gnu-gcc -Os -static -pthread -I. -o tpws *.c -lpthread
          test -f tpws
          file tpws
          if ! file tpws | grep -q "MSB"; then
            echo "Not big-endian!" >&2; exit 1
          fi
          if file tpws | grep -q "dynamically"; then
            echo "Not static!" >&2; exit 1
          fi

      - name: Strip and package
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          mips-linux-gnu-strip --strip-all tpws
          ls -lh tpws
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp tpws "$GITHUB_WORKSPACE/dist/tpws-mips-msb"

      - name: Upload tpws artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpws-mips-msb
          path: dist/tpws-mips-msb
          if-no-files-found: error
          retention-days: 30
