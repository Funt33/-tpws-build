name: Get tpws for MIPS big-endian
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tpws-mips.yml"
permissions:
  contents: read
jobs:
  fetch-tpws:
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt tpws from zapret release
        shell: bash
        run: |
          set -euo pipefail
          URL=$(curl -s https://api.github.com/repos/bol-van/zapret/releases/latest \
                | grep -oE 'https://github.com/bol-van/zapret/releases/download/[^"]+\.tar\.gz' \
                | head -n1)
          echo "Asset: $URL"
          test -n "$URL"
          wget -q "$URL" -O /tmp/zapret.tar.gz
          mkdir -p /tmp/z && tar -C /tmp/z -xzf /tmp/zapret.tar.gz
          DIR=$(find /tmp/z -maxdepth 1 -type d -name 'zapret-v*')
          test -f "$DIR/binaries/linux-mips/tpws"
          cp "$DIR/binaries/linux-mips/tpws" tpws-mips-msb
          chmod +x tpws-mips-msb
          file tpws-mips-msb
          if ! file tpws-mips-msb | grep -q "MSB"; then
            echo "ERROR: not big-endian!" >&2; exit 1
          fi
          ls -lh tpws-mips-msb

      - name: Upload tpws artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpws-mips-msb
          path: tpws-mips-msb
          if-no-files-found: error
          retention-days: 30
