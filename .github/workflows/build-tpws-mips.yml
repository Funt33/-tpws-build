name: Build tpws for MIPS big-endian

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tpws-mips.yml"

permissions:
  contents: read

jobs:
  build-tpws-mips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            make \
            binutils

      - name: Clone zapret
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bol-van/zapret.git zapret

      - name: Install MIPS big-endian musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musl"
          curl --fail --show-error --location --retry 3 \
            https://musl.cc/mips-linux-musl-cross.tgz \
            --output "$RUNNER_TEMP/mips-linux-musl-cross.tgz"
          tar -xzf "$RUNNER_TEMP/mips-linux-musl-cross.tgz" \
            -C "$RUNNER_TEMP/musl"
          TOOLCHAIN_DIR="$(find "$RUNNER_TEMP/musl" -type f \
            -name 'mips-linux-musl-gcc' -printf '%h\n' | head -n 1)"
          TOOLCHAIN_BIN="$(dirname "$TOOLCHAIN_DIR")"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          "$TOOLCHAIN_DIR/mips-linux-musl-gcc" --version

      - name: Build tpws statically
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          make clean || true
          make CC=mips-linux-musl-gcc LDFLAGS="-static"
          test -f tpws
          file tpws
          if readelf -h tpws | grep -Eq 'Data:.*little endian|LSB'; then
            echo "Binary is little-endian, MSB required" >&2
            exit 1
          fi

      - name: Strip and validate binary
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          mips-linux-musl-strip --strip-all tpws
          file tpws
          if readelf -l tpws | grep -q 'INTERP'; then
            echo "Binary is dynamically linked" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp tpws "$GITHUB_WORKSPACE/dist/tpws-mips-msb"

      - name: Upload tpws artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpws-mips-msb
          path: dist/tpws-mips-msb
          if-no-files-found: error
          retention-days: 30
