name: Build tpws for MIPS big-endian
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-tpws-mips.yml"
permissions:
  contents: read
jobs:
  build-tpws-mips:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates make binutils file

      - name: Clone zapret
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bol-van/zapret.git zapret

      - name: Install MIPS big-endian musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musl"
          curl --fail --show-error --location --retry 3 \
            https://musl.cc/mips-linux-musl-cross.tgz \
            --output "$RUNNER_TEMP/mips-linux-musl-cross.tgz"
          tar -xzf "$RUNNER_TEMP/mips-linux-musl-cross.tgz" -C "$RUNNER_TEMP/musl"
          TOOLCHAIN_BIN="$(find "$RUNNER_TEMP/musl" -type d -name bin | head -n 1)"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          "$TOOLCHAIN_BIN/mips-linux-musl-gcc" --version

      - name: Build tpws statically (direct gcc, no make)
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          mips-linux-musl-gcc -Os -static -I. -o tpws *.c
          test -f tpws
          file tpws
          if ! file tpws | grep -q "MSB"; then
            echo "Not big-endian!" >&2; exit 1
          fi
          if file tpws | grep -q "dynamically"; then
            echo "Not static!" >&2; exit 1
          fi

      - name: Strip and package
        shell: bash
        working-directory: zapret/tpws
        run: |
          set -euo pipefail
          mips-linux-musl-strip --strip-all tpws
          ls -lh tpws
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp tpws "$GITHUB_WORKSPACE/dist/tpws-mips-msb"

      - name: Upload tpws artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpws-mips-msb
          path: dist/tpws-mips-msb
          if-no-files-found: error
          retention-days: 30
